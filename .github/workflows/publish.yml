name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Verify tag matches built wheel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import zipfile

          tag = os.environ["TAG"].lstrip("v")
          matches = glob.glob("dist/*.whl")
          if not matches:
              print("REJECT: no wheel was built")
              sys.exit(1)
          whl = matches[0]

          with zipfile.ZipFile(whl) as z:
              meta_name = next(n for n in z.namelist() if n.endswith("/METADATA"))
              metadata = z.read(meta_name).decode("utf-8")
              built_version = None
              for line in metadata.splitlines():
                  if line.lower().startswith("version:"):
                      built_version = line.split(":", 1)[1].strip()
                      break

          if not built_version:
              print("REJECT: could not find version in METADATA")
              sys.exit(1)

          if tag != built_version:
              print(f"REJECT: tag '{tag}' != built version '{built_version}'")
              sys.exit(1)

          print(f"ACCEPT: tag '{tag}' matches built version '{built_version}'")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
